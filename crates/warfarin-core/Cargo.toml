[package]
name = "warfarin-core"
version = "0.1.0"
description = "Pure domain logic for warfarin-care (no I/O, no Tauri)"
edition = "2024"
authors = ["Suradet Pratomsak"]
license = "MIT"

[lib]
name = "warfarin_core"

[dependencies]
# Serialization for IPC models and encrypted JSON envelopes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Date math for TTR (Rosendaal interpolation) and pill-dispense summaries.
chrono = { version = "0.4", features = ["serde"] }

# Structured error types at the library boundary (AGENTS-RUST §5.2).
thiserror = "2"

# Thai/English usage-text parsing in the dose module.
regex = "1"

# AES-256-GCM encryption of MySQL/Supabase credentials at rest.
aes-gcm = "0.11"
hkdf = "0.13"
rand = "0.10"
sha2 = "0.11"
base64 = "0.22"

# Argon2id password hashing for the local-auth subsystem.
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
