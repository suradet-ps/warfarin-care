# cargo-deny configuration for warfarin-care
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
  # proc-macro-error unmaintained (transitive dep of glib/gtk)
  "RUSTSEC-2024-0370",
  # quick-xml vulnerabilities (pinned by plist in tauri, no upgrade available)
  { id = "RUSTSEC-2026-0194", reason = "pinned by plist 1.9.0 in tauri, no compatible upgrade" },
  { id = "RUSTSEC-2026-0195", reason = "pinned by plist 1.9.0 in tauri, no compatible upgrade" },
  # unic-* unmaintained (transitive dep of tauri-utils via urlpattern)
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
  "Unicode-TOU",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MPL-2.0",
]
confidence-threshold = 0.92

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
