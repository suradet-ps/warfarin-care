[package]
name = "warfarin-care"
version = "2.2.0"
description = "Warfarin Care — Clinic Management System"
authors = ["Suradet Pratomsak"]
edition = "2024"
license = "MIT"

[lib]
name = "warfarin_care_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace crates — pure logic + data access. Tauri coupling stays in this
# crate only; never add `tauri` as a dependency of `crates/*`.
warfarin-core = { path = "../crates/warfarin-core" }
warfarin-db = { path = "../crates/warfarin-db" }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
encryptman-keyring = "0.1"
sqlx = { version = "0.9", features = ["mysql", "sqlite", "runtime-tokio", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
